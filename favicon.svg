<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Савелий — кот-репетитор">
  <!-- Значок вкладки. Повторяет icon-192.png и icon-512.png: те давно
       лежат в манифесте и уже стоят на домашних экранах у тех, кто
       поставил сайт приложением. Значок вкладки, отличающийся от значка
       приложения, читался бы как другой сайт, поэтому рисунок тот же —
       кот, а цвета взяты пипеткой из самого PNG.

       Файла тут не было вовсе: index.html и board.html ссылались на
       favicon.svg, а он отдавал 404 и на бою тоже. -->
  <rect width="512" height="512" fill="#FF8C42"/>
  <g fill="#FFF8F0">
    <!-- хвост: рисуем до тела, чтобы тело его перекрыло у основания -->
    <path d="M330 250 Q412 268 400 360 L366 360 Q376 292 316 282 Z"/>
    <!-- уши -->
    <path d="M134 94 L234 118 L184 198 Z"/>
    <path d="M378 94 L278 118 L328 198 Z"/>
    <!-- голова и тело -->
    <circle cx="256" cy="212" r="100"/>
    <ellipse cx="256" cy="338" rx="92" ry="80"/>
  </g>
  <g fill="#FF8C42">
    <!-- глаза -->
    <circle cx="220" cy="204" r="15"/>
    <circle cx="292" cy="204" r="15"/>
    <!-- нос -->
    <path d="M256 222 L278 244 L256 266 L234 244 Z"/>
  </g>
</svg>
