<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Доска — Савелий</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preload" href="css/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=199">
  <script>
    try {
      var t = localStorage.getItem("savelyTheme");
      if (t !== "night" && t !== "day")
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
      document.documentElement.dataset.theme = t;
    } catch (e) { /* приватный режим */ }
  </script>
  <link rel="stylesheet" href="css/tokens.css?v=199">
  <link rel="stylesheet" href="css/style.css?v=199">
  <link rel="stylesheet" href="css/board.css?v=199">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="board-body">

<!-- Полотно на весь экран: доска — это рабочее место, а не раздел сайта,
     поэтому шапки сайта здесь нет, только своя тонкая панель. -->
<canvas id="board-canvas"></canvas>

<!-- Верхняя панель: кто где и что с доской -->
<header class="bd-top">
  <a class="bd-back" href="tutor.html" id="bd-back" title="Выйти с доски">←</a>
  <div class="bd-title">
    <span id="bd-name">Доска</span>
    <span class="bd-state" id="bd-state">сохраняю…</span>
  </div>
  <div class="bd-top-right">
    <span class="bd-live" id="bd-live" hidden>ученик на доске</span>
    <button class="bd-btn" id="bd-share" hidden>Открыть ученику</button>
    <button class="bd-btn" id="bd-png" title="Скачать картинкой">
      <span data-icon="download" data-icon-size="18"></span> PNG</button>
    <button class="bd-btn" id="bd-clear" title="Очистить доску"
            data-icon="trash" data-icon-size="18"></button>
    <button class="bd-btn" id="bd-theme" title="День и ночь"
            data-icon="moon" data-icon-size="18"></button>
  </div>
</header>

<!-- Инструменты и их настройки — ОДНА панель, а не два столбика рядом.
     Раньше цвет с толщиной жили отдельной плашкой правее, и связь между
     «выбрал ручку» и «выбрал цвет» приходилось додумывать.

     Настройки показываются по месту: у ластика и выделения цвета нет,
     у стикера свои цвета бумаги, у остальных — цвета чернил. Панель
     слева и вертикально, чтобы не спорить с рукой на планшете. -->
<nav class="bd-dock" aria-label="Инструменты">
  <div class="bd-tools">
    <button class="bd-tool active" data-tool="select" title="Выделить и двигать (V)"
            data-icon="cursor" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="pen" title="Ручка (P)"
            data-icon="pen" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="marker" title="Маркер — полупрозрачный (M)"
            data-icon="marker" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="eraser" title="Ластик (E)"
            data-icon="eraser" data-icon-size="22"></button>
    <div class="bd-sep"></div>
    <button class="bd-tool" data-tool="note" title="Стикер (S)"
            data-icon="note" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="text" title="Текст (T)"
            data-icon="textTool" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="rect" title="Прямоугольник (R)"
            data-icon="square" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="ellipse" title="Овал (O)"
            data-icon="circle" data-icon-size="22"></button>
    <button class="bd-tool" data-tool="arrow" title="Стрелка (A)"
            data-icon="diagonal" data-icon-size="22"></button>
    <div class="bd-sep"></div>
    <button class="bd-tool bd-tool-words" id="bd-words" title="Слова ученика (W)"
            data-icon="words" data-icon-size="22"></button>
  </div>

  <!-- Цвет и толщина: часть той же панели, отделены линией -->
  <div class="bd-style" id="bd-style">
    <div class="bd-colors" id="bd-colors" role="group" aria-label="Цвет"></div>
    <div class="bd-sizes" id="bd-sizes" role="group" aria-label="Толщина"></div>
  </div>
</nav>

<!-- Низ: отмена, масштаб -->
<!-- «Очистить» уехала отсюда наверх, к остальным действиям над доской:
     стирающая всё кнопка не должна стоять вплотную к зуму, по которому
     жмут не глядя. -->
<div class="bd-bottom">
  <button class="bd-btn" id="bd-undo" title="Отменить (Ctrl+Z)"
          data-icon="undo" data-icon-size="19"></button>
  <button class="bd-btn" id="bd-redo" title="Вернуть (Ctrl+Shift+Z)"
          data-icon="redo" data-icon-size="19"></button>
  <div class="bd-sep-h"></div>
  <button class="bd-btn" id="bd-zoom-out" title="Мельче"
          data-icon="zoomOut" data-icon-size="19"></button>
  <button class="bd-btn bd-zoom" id="bd-zoom" title="Вернуть 100%">100%</button>
  <button class="bd-btn" id="bd-zoom-in" title="Крупнее"
          data-icon="zoomIn" data-icon-size="19"></button>
  <div class="bd-sep-h"></div>
  <button class="bd-btn" id="bd-fit" title="Показать всё"
          data-icon="fit" data-icon-size="19"></button>
</div>

<!-- Панель слов: то, ради чего доска именно наша, а не Miro.
     Слова ученика перетаскиваются на доску карточками. -->
<aside class="bd-panel" id="bd-panel" hidden>
  <div class="bd-panel-head">
    <b>Слова на доску</b>
    <button class="bd-btn" id="bd-panel-close" aria-label="Закрыть">✕</button>
  </div>
  <select id="bd-student" class="bd-select"></select>
  <input type="search" id="bd-search" class="bd-input" placeholder="Найти слово…">
  <p class="bd-hint" id="bd-words-hint">Нажми на слово — карточка ляжет на доску.
    Перевод у карточки скрыт: нажми на неё на доске, чтобы открыть.</p>
  <div class="bd-word-list" id="bd-word-list"></div>
</aside>

<!-- Ввод текста поверх доски: системные prompt() на сайте запрещены
     (во встроенных браузерах их блокируют), поэтому своё поле. -->
<div class="bd-editor" id="bd-editor" hidden>
  <textarea id="bd-editor-input" rows="3" placeholder="Текст…"></textarea>
  <div class="bd-editor-row">
    <button class="bd-btn primary" id="bd-editor-ok">Готово</button>
    <button class="bd-btn" id="bd-editor-cancel">Отмена</button>
  </div>
</div>

<p class="bd-toast" id="bd-toast" hidden></p>

<script defer src="js/icons.js?v=199"></script>
<script defer src="js/util.js?v=199"></script>
<script defer src="js/board.js?v=199"></script>
</body>
</html>
