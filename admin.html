<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Савелий</title>
<meta name="robots" content="noindex, nofollow">
<!-- Без доктайпа браузер уходил в quirks mode, а без ссылки на шрифт
     админка рисовалась системным — единственная страница из трёх. -->
  <!-- Шрифты свои, не гугловские: чужой домен из критического пути убран,
       см. css/fonts.css. Предзагрузка ровно двух файлов, которые нужны
       любой странице сайта — русский текст и английские слова. Остальные
       подмножества браузер возьмёт сам, если встретит редкую букву. -->
  <link rel="preload" href="css/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=220">
<!-- Тему ставим ДО первой отрисовки, отдельным крошечным скриптом.
     Всё остальное грузится с defer, а defer выполняется после разбора
     страницы — то есть уже после того, как браузер её показал. Оставить
     выбор темы в theme.js значило бы мигать ночному пользователю белым
     экраном на долю секунды, и это заметнее любой анимации. Дальше
     theme.js подхватит: кнопку, цвет строки состояния, слежение
     за системной темой. -->
<script>
  try {
    var t = localStorage.getItem("savelyTheme");
    if (t !== "night" && t !== "day")
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    document.documentElement.dataset.theme = t;
  } catch (e) { /* приватный режим — просто останется дневная */ }
</script>
<link rel="stylesheet" href="css/tokens.css?v=220">
<link rel="stylesheet" href="css/style.css?v=220">
  <link rel="stylesheet" href="css/savely.css?v=220">
<link rel="stylesheet" href="css/tutor.css?v=220">
<link rel="stylesheet" href="css/motion.css?v=220">
<link rel="stylesheet" href="css/cat.css?v=220">
<link rel="stylesheet" href="css/a11y.css?v=220">
<link rel="stylesheet" href="css/admin.css?v=220">
</head>
<body>

<section id="screen-login" class="screen">
  <div class="hero">
    <div class="cat-avatar cat-big"></div>
    <h1>Админка</h1>
    <p class="hero-sub">Владельцу сайта: все репетиторы, ученики и деньги.</p>
    <div class="card auth-card">
      <form id="login-form">
        <label>Пароль
          <span class="pass-field">
            <input type="password" id="a-pass" autocomplete="current-password" required>
            <button type="button" class="pass-eye" data-eye="a-pass"
                    aria-label="Показать пароль" aria-pressed="false"></button>
          </span>
        </label>
        <button type="submit" class="btn btn-primary btn-wide">Войти</button>
        <p class="type-feedback err" id="login-error"></p>
      </form>
      <p class="reset-note" style="margin-top:14px">Пароль лежит на сервере в файле
        <code>savely-data/admin.txt</code>. Его нет ни в коде, ни в репозитории.</p>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand"><span class="brand-cat cat-avatar" data-cat="hello" aria-hidden="true"></span> Савелий · админка</button>
      <div class="user-chip">
        <span id="ai-chip" class="plan-chip"></span>
        <button id="logout-btn" class="link-btn">выйти</button>
      </div>
    </div>
  </header>

  <main class="wide">
    <div class="admin-stats" id="overview"></div>
    <h2 class="section-title">Репетиторы</h2>
    <div id="tutors"></div>

    <!-- Ученики без репетитора: сами зарегистрировались на сайте.
         Личный код виден сознательно — это инструмент поддержки:
         «потерял код, вот моя почта» решается только отсюда. -->
    <h2 class="section-title" style="margin-top:36px">Ученики без репетитора</h2>
    <p class="muted-note" id="standalone-lead"></p>
    <div id="standalone"></div>

    <!-- Лог ошибок. До него исключения уходили только в stderr — на
         хостинге это журнал Apache, который никто не открывает, и о сбоях
         владелец узнавал от репетиторов. Список грузится отдельным
         запросом: полсотни стеков весят больше всей остальной сводки. -->
    <div class="section-head err-head">
      <h2 class="section-title">Ошибки сервера</h2>
      <button class="btn btn-ghost btn-small" id="err-clear" hidden>Очистить</button>
    </div>
    <p class="muted-note" id="err-lead">Загружаю…</p>
    <div id="errors"></div>
  </main>
</div>

<script defer src="js/theme.js?v=220"></script>
<script defer src="js/icons.js?v=220"></script>
<script defer src="js/cat.js?v=220"></script>
<script defer src="js/motion.js?v=220"></script>
<script defer src="js/util.js?v=220"></script>
<script defer src="js/admin.js?v=220"></script>

</body>
</html>
