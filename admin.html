<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Савелий</title>
<meta name="robots" content="noindex, nofollow">
<!-- Без доктайпа браузер уходил в quirks mode, а без ссылки на шрифт
     админка рисовалась системным — единственная страница из трёх. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=86">
<link rel="stylesheet" href="css/style.css?v=86">
  <link rel="stylesheet" href="css/savely.css?v=86">
<link rel="stylesheet" href="css/tutor.css?v=86">
<link rel="stylesheet" href="css/motion.css?v=86">
<link rel="stylesheet" href="css/a11y.css?v=86">
<link rel="stylesheet" href="css/admin.css?v=86">
</head>
<body>

<section id="screen-login" class="screen">
  <div class="hero">
    <div class="cat-avatar cat-big"></div>
    <h1>Админка</h1>
    <p class="hero-sub">Владельцу сайта: все репетиторы, ученики и деньги.</p>
    <div class="card auth-card">
      <form id="login-form">
        <label>Пароль
          <span class="pass-field">
            <input type="password" id="a-pass" autocomplete="current-password" required>
            <button type="button" class="pass-eye" data-eye="a-pass"
                    aria-label="Показать пароль" aria-pressed="false"></button>
          </span>
        </label>
        <button type="submit" class="btn btn-primary btn-wide">Войти</button>
        <p class="type-feedback err" id="login-error"></p>
      </form>
      <p class="reset-note" style="margin-top:14px">Пароль лежит на сервере в файле
        <code>savely-data/admin.txt</code>. Его нет ни в коде, ни в репозитории.</p>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand"><span class="brand-cat cat-avatar" data-cat="hello" aria-hidden="true"></span> Савелий · админка</button>
      <div class="user-chip">
        <span id="ai-chip" class="plan-chip"></span>
        <button id="logout-btn" class="link-btn">выйти</button>
      </div>
    </div>
  </header>

  <main class="wide">
    <div class="admin-stats" id="overview"></div>
    <h2 class="section-title">Репетиторы</h2>
    <div id="tutors"></div>
  </main>
</div>

<script src="js/theme.js?v=86"></script>
<script src="js/icons.js?v=86"></script>
<script src="js/cat.js?v=86"></script>
<script src="js/motion.js?v=86"></script>
<script src="js/util.js?v=86"></script>
<script src="js/admin.js?v=86"></script>

</body>
</html>
