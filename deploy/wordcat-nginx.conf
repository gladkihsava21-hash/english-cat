# nginx для wordcat.ru: статика с диска, API — в наш server.py на 4210.
# TLS-блок добавит certbot сам (шаг 4 в vps-setup.sh).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /opt/wordcat/app;
    index index.html;

    # Сжатие: словарь и код летят в 3-4 раза быстрее
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Версия зашита в ?v= — файлы можно кэшировать навечно
    location ~* \.(js|css|png|jpg|svg|woff2|mp4)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4210;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 13m;   # фото тетрадей в base64
    }
    location /health {
        proxy_pass http://127.0.0.1:4210;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Страницы и всё остальное — статикой; служебное закрыто
    location ~ ^/(savely-data|deploy|tools|\.git) { deny all; }
    location / { try_files $uri $uri/ =404; }
}
